{% extends 'base.html' %}

{% block content %}
<h2>Удаление объявления</h2>
<p>Вы уверены, что хотите удалить объявление "<strong>{{ ad.title }}</strong>"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" style="background: red; color: white;">Да, удалить</button>
    <a href="{% url 'ad_detail' ad.pk %}">Отмена</a>
</form>
{% endblock %}
